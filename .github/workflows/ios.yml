name: iOS native build and simulator verification
on:
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: 'Sign and upload to App Store Connect after all tests pass'
        type: boolean
        default: false
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned engine, model, artwork and independent Quest fixture
        run: |
          set -euo pipefail
          python -m pip install py7zr==1.1.4 python-shogi==1.1.1 Pillow==11.3.0
          python native-three-minute/scripts/prepare_yaneura.py
          python ios/scripts/prepare.py
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd ios
          xcodegen generate
          mkdir -p outputs
          xcodebuild -version | tee outputs/xcode-version.txt
      - name: Build embedded engine for iPhone and Simulator
        run: |
          set -euo pipefail
          python ios/scripts/build_engine.py --sdk iphoneos 2>&1 | tee ios/outputs/engine-iphoneos.txt
          python ios/scripts/build_engine.py --sdk iphonesimulator 2>&1 | tee ios/outputs/engine-simulator.txt
      - name: Build unsigned iPhone application
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project BeniShogi.xcodeproj -scheme BeniShogi -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DeviceData" -resultBundlePath "$PWD/outputs/DeviceBuild.xcresult" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee outputs/device-build.txt
      - name: Install and test real iOS application
        working-directory: ios
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > outputs/simulators.json
          UDID=$(python -c 'import json; d=json.load(open("outputs/simulators.json")); phones=[v for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")]; print(next((v["udid"] for v in phones if "Pro Max" in v["name"]),phones[0]["udid"]))')
          echo "$UDID" > outputs/simulator-udid.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          args=(-project BeniShogi.xcodeproj -scheme BeniShogi -configuration Debug -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-)
          xcodebuild "${args[@]}" build-for-testing 2>&1 | tee outputs/simulator-build.txt
          if env TEST_RUNNER_BENI_UNIT_TEST_HOST=1 xcodebuild "${args[@]}" -resultBundlePath outputs/Tests.xcresult -only-testing:BeniShogiTests -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 test-without-building 2>&1 | tee outputs/simulator-tests.txt; then UNIT_STATUS=0; else UNIT_STATUS=$?; fi
          # Seed the real OS pasteboard immediately before the UI flow, after StoreKit tests.
          xcrun simctl pbcopy "$UDID" < ../native-three-minute/tests/fixtures/shogi_quest_79.kif
          xcodebuild "${args[@]}" -resultBundlePath outputs/UITests.xcresult -only-testing:BeniShogiUITests -skip-testing:BeniShogiUITests/FlowTests/testStoreScreenshots test-without-building 2>&1 | tee -a outputs/simulator-tests.txt
          test "$UNIT_STATUS" -eq 0
          xcrun simctl launch "$UDID" com.presentsoft.shogi3minutes || true
          sleep 3
          xcrun simctl io "$UDID" screenshot outputs/home.png
      - name: Capture iPhone store screenshots from a fresh app install
        if: always()
        working-directory: ios
        run: |
          set -euo pipefail
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/BeniShogi.app
          UDID=$(cat outputs/simulator-udid.txt)
          xcrun simctl terminate "$UDID" com.presentsoft.shogi3minutes || true
          xcrun simctl uninstall "$UDID" com.presentsoft.shogi3minutes || true
          xcodebuild -project BeniShogi.xcodeproj -scheme BeniShogi -configuration Debug -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -resultBundlePath outputs/iPhoneStore.xcresult -only-testing:BeniShogiUITests/FlowTests/testStoreScreenshots test-without-building 2>&1 | tee outputs/iphone-store.txt
      - name: Capture iPad store screenshots
        if: always()
        working-directory: ios
        run: |
          set -euo pipefail
          IPAD=$(python -c 'import json; d=json.load(open("outputs/simulators.json")); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPad Pro 13-inch" in v["name"]))')
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPAD" -b
          xcodebuild -project BeniShogi.xcodeproj -scheme BeniShogi -configuration Debug -destination "platform=iOS Simulator,id=$IPAD" -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -resultBundlePath outputs/iPadStore.xcresult -only-testing:BeniShogiUITests/FlowTests/testStoreScreenshots test-without-building 2>&1 | tee outputs/ipad-store.txt
      - name: Collect test attachments and reproducible build artifacts
        if: always()
        run: |
          mkdir -p ios/outputs
          if test -d ios/outputs/Tests.xcresult; then xcrun xcresulttool export attachments --path ios/outputs/Tests.xcresult --output-path ios/outputs/screenshots || true; fi
          if test -d ios/outputs/UITests.xcresult; then xcrun xcresulttool export attachments --path ios/outputs/UITests.xcresult --output-path ios/outputs/screenshots-ui || true; fi
          if test -d ios/outputs/iPhoneStore.xcresult; then xcrun xcresulttool export attachments --path ios/outputs/iPhoneStore.xcresult --output-path ios/outputs/screenshots-iphone || true; fi
          if test -d ios/outputs/iPadStore.xcresult; then xcrun xcresulttool export attachments --path ios/outputs/iPadStore.xcresult --output-path ios/outputs/screenshots-ipad || true; fi
          python ios/scripts/package.py
      - name: Sign and upload approved App Store build
        if: success() && github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.SHOGI_ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.SHOGI_ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.SHOGI_ASC_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.SHOGI_CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing signing secret: $name" >&2; exit 1; }
          done
          python -m pip install codemagic-cli-tools
          bash ios/scripts/upload_app_store.sh
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeniShogi-iOS-${{ github.run_id }}
          path: ios/outputs/
          retention-days: 14
      - name: Save downloads to GitHub build branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -b "build/ios-$GITHUB_RUN_ID" FETCH_HEAD
          shopt -s nullglob
          downloads=(ios/outputs/*.zip ios/outputs/*.ipa ios/outputs/*.json ios/outputs/*.txt ios/outputs/*.png ios/outputs/README.md)
          git add -f -- "${downloads[@]}"
          git commit -m "iOS build $GITHUB_RUN_ID outputs"
          git push origin HEAD
