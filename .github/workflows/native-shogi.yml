name: Native Shogi APK and emulator verification
on:
  pull_request:
    paths: ['native-three-minute/**', '.github/workflows/native-shogi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-three-minute
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rule and clock assertions
        run: |
          mkdir -p test-classes outputs
          javac -d test-classes app/src/main/java/com/presentsoft/shogi3minutes/ShogiGame.java app/src/main/java/com/presentsoft/shogi3minutes/MatchClock.java app/src/main/java/com/presentsoft/shogi3minutes/UsiPosition.java app/src/main/java/com/presentsoft/shogi3minutes/StudySession.java app/src/main/java/com/presentsoft/shogi3minutes/StudyAnalysis.java app/src/main/java/com/presentsoft/shogi3minutes/EvaluationHistory.java tests/EvaluationTest.java tests/AnalysisTest.java tests/StudyTest.java tests/RulesTest.java tests/RuleProbe.java app/src/main/java/com/presentsoft/shogi3minutes/UsiProcess.java tests/ProtocolTest.java tests/StudyHistoryTest.java app/src/main/java/com/presentsoft/shogi3minutes/KifRecord.java tests/KifRecordTest.java
          chmod +x tests/fake_usi.py
          java -cp test-classes com.presentsoft.shogi3minutes.KifRecordTest tests/fixtures/shogi_quest_79.kif outputs/kif_positions.txt | tee outputs/kif_import_host.txt
          java -cp test-classes com.presentsoft.shogi3minutes.StudyHistoryTest | tee outputs/graph_history.txt
          java -cp test-classes com.presentsoft.shogi3minutes.ProtocolTest tests/fake_usi.py | tee outputs/protocol.txt
          java -cp test-classes com.presentsoft.shogi3minutes.RulesTest | tee outputs/rules.txt
          java -cp test-classes com.presentsoft.shogi3minutes.StudyTest | tee outputs/study.txt
          java -cp test-classes com.presentsoft.shogi3minutes.AnalysisTest | tee outputs/analysis.txt
          java -cp test-classes com.presentsoft.shogi3minutes.EvaluationTest | tee outputs/evaluation.txt
          pip install python-shogi==1.1.1 py7zr==1.1.4
          python tests/differential.py test-classes | tee outputs/differential.txt
          python tests/verify_quest_record.py tests/fixtures/shogi_quest_79.kif outputs/kif_positions.txt | tee outputs/kif_independent.txt
      - name: Prepare pinned micro model and complete GPL source
        run: python scripts/prepare_yaneura.py
      - name: Build installable native APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
          if ! python scripts/restore_native_cache.py; then
            sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
            python scripts/build_yaneura.py --ndk "$ANDROID_HOME/ndk/27.2.12479018"
            python scripts/prepare_ndk_notices.py "$ANDROID_HOME/ndk/27.2.12479018"
          fi
          base64 -d debug.keystore.b64 > debug.keystore
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          python scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk outputs/Shogi_3min.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose outputs/Shogi_3min.apk | tee outputs/signature.txt
      - name: Verify both exact APK ARM64 engines with Android 16 bionic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user e2fsprogs
          python scripts/verify_arm64_dynamic.py | tee outputs/arm64_dynamic.txt
      - name: Release build toolchains before emulator
        run: sudo python3 scripts/free_ci_disk.py "$ANDROID_HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, play and capture real UI
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          working-directory: native-three-minute
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -partition-size 2048
          disable-animations: true
          script: bash scripts/emulator_test.sh
      - name: Archive complete source with original images
        if: always()
        run: |
          mkdir -p outputs
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('outputs/Shogi_3min_complete_source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('.').rglob('*'):
              if p.is_file() and not any(x in p.parts for x in ['.gradle','build','outputs','test-classes','.git','.ai-cache','host-bench','.cxx','__pycache__','jniLibs']) and p.name!='local.properties':
                z.write(p,Path('shogi_3min_complete_native')/p)
            z.write('../.github/workflows/native-shogi.yml',Path('shogi_3min_complete_native')/'ci/native-shogi.yml')
          PY
      - name: Save APK, source and verification to build branch
        if: always()
        run: |
          python scripts/prepare_download.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -b "build/native-shogi-$GITHUB_RUN_ID" FETCH_HEAD
          git add -f outputs/
          git commit -m "Native shogi build $GITHUB_RUN_ID outputs"
          git push origin HEAD


