name: BeniShogi
options:
  bundleIdPrefix: com.presentsoft
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    CODE_SIGNING_ALLOWED: NO
    CURRENT_PROJECT_VERSION: '27'
    MARKETING_VERSION: '1.18.0'
packages:
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 12.14.0
targets:
  BeniShogi:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    sources:
      - path: Sources
      - path: StoreKit/CoffeeSupport.storekit
        buildPhase: resources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: GameAssets
        type: folder
    settings:
      base:
        ADMOB_APP_ID: ca-app-pub-6772282664898856~6282999949
        PRODUCT_BUNDLE_IDENTIFIER: com.presentsoft.shogi3minutes
        SWIFT_OBJC_BRIDGING_HEADER: Engine/Bridging.h
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Engine'
        OTHER_LDFLAGS: '$(inherited) -Wl,-force_load,$(SRCROOT)/build/engine/$(PLATFORM_NAME)/libBKEngine.a -lc++'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
      configs:
        Debug:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
    info:
      path: build/Info.plist
      properties:
        CFBundleIdentifier: '$(PRODUCT_BUNDLE_IDENTIFIER)'
        CFBundleExecutable: '$(EXECUTABLE_NAME)'
        CFBundleName: '$(PRODUCT_NAME)'
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: '6.0'
        CFBundleDevelopmentRegion: ja
        LSRequiresIPhoneOS: true
        CFBundleDisplayName: AI将棋検討
        CFBundleShortVersionString: '1.18.0'
        CFBundleVersion: '27'
        GADApplicationIdentifier: '$(ADMOB_APP_ID)'
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Tests run the online mode against a relay on 127.0.0.1 (ws://). Public relays always use wss://.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BeniShogiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: StoreKit/CoffeeSupport.storekit
        buildPhase: resources
    dependencies:
      - target: BeniShogi
  BeniShogiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BeniShogi
schemes:
  BeniShogi:
    build:
      targets:
        BeniShogi: all
    run:
      storeKitConfiguration: StoreKit/CoffeeSupport.storekit
    test:
      targets: [BeniShogiTests, BeniShogiUITests]
      gatherCoverageData: true
