plugins { id 'com.android.application' }
android {
    namespace 'com.presentsoft.shogi3minutes'
    compileSdk 35
    defaultConfig {
        applicationId 'com.presentsoft.shogi3minutes'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '1.12.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'com.presentsoft.shogi3minutes.NativeSmokeTest'
    }
    signingConfigs { debug { storeFile rootProject.file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    ndkVersion '27.2.12479018'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { androidTest { assets.srcDir rootProject.file('tests/fixtures') } }
}




