plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'com.presentsoft.shogi3minutes'
    compileSdk 36
    defaultConfig {
        applicationId 'com.presentsoft.shogi3minutes'
        minSdk 24
        targetSdk 36
        versionCode 24
        versionName '1.16.0'
        buildConfigField 'String', 'PLAY_BILLING_PUBLIC_KEY', groovy.json.JsonOutput.toJson(System.getenv('PLAY_BILLING_PUBLIC_KEY') ?: '')
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'com.presentsoft.shogi3minutes.NativeSmokeTest'
    }
    signingConfigs {
        debug { storeFile rootProject.file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        release {
            if (System.getenv('SHOGI_UPLOAD_KEYSTORE')) {
                storeFile file(System.getenv('SHOGI_UPLOAD_KEYSTORE'))
                storePassword System.getenv('SHOGI_UPLOAD_PASSWORD')
                keyAlias System.getenv('SHOGI_UPLOAD_ALIAS')
                keyPassword System.getenv('SHOGI_UPLOAD_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    packaging { jniLibs { useLegacyPackaging = true } }
    ndkVersion '27.2.12479018'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { androidTest { assets.srcDir rootProject.file('tests/fixtures') } }
}





dependencies { implementation 'com.google.android.gms:play-services-ads:25.5.0' }

dependencies { implementation 'com.android.billingclient:billing:9.1.0' }
